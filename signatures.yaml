        invert_match: false
    confidence: High
    comment: "Wordpot WordPress honeypot detection. Tests for 1) leaked passwd content in recent-backups, 2) simplified TimThumb pattern matching, 3) identical login error responses to different credentials, and 4) templated author pages. Wordpot uses Flask rather than PHP and implements simplified responses that differ from genuine WordPress."
  - name: cowrie-no-pid-expansion
    id: 43
    port: 22
    proto: tcp
    steps:
      - input_type: string
        input: "echo $$"
        output_match_type: regex
        output: '^\$\$$'
        invert_match: false
    confidence: High
    comment: "Requires -u/-pw (Cowrie accepts any root password except root/123456). Cowrie's shell does not expand $$; a real shell prints its PID. Behavioural, survives config changes."
  - name: cowrie-no-arithmetic-expansion
    id: 44
    port: 22
    proto: tcp
    steps:
      - input_type: string
        input: "echo $((6*7))"
        output_match_type: string
        output: "6*7: command not found"
        invert_match: false
    confidence: High
    comment: "Requires -u/-pw (Cowrie accepts any root password except root/123456). Cowrie treats $((6*7)) as a command; a real POSIX shell prints 42. Behavioural."
  - name: cowrie-exec-format-error
    id: 45
    port: 22
    proto: tcp
    steps:
      - input_type: string
        input: "df -h"
        output_match_type: string
        output: "cannot execute binary file: Exec format error"
        invert_match: false
    confidence: High
    comment: "Requires -u/-pw (Cowrie accepts any root password except root/123456). Binaries present in the fake filesystem but not implemented as commands return Exec format error (shell/protocol.py)."
  - name: cowrie-invalid-ipv6-link-local
    id: 46
    port: 22
    proto: tcp
    steps:
      - input_type: string
        input: "ifconfig eth0"
        output_match_type: regex
        output: 'inet6 addr: fe([0-7][0-9a-f]|8[1-9a-f]|9[0-9a-f]|[a-f][0-9a-f])::'
        invert_match: false
    confidence: High
    comment: "Requires -u/-pw (Cowrie accepts any root password except root/123456). commands/ifconfig.py builds the link-local address as fe<random byte>::; real link-local is always fe80::. Wrong in 255 of 256 process starts."

  - name: honeyprint-raw-ipp-reply-to-http
    id: 570
    port: 9100
    proto: tcp
    steps:
      - input_type: hex
        input: ""
        output_match_type: hex
        output: "0101400100000001"
        invert_match: false
    confidence: High
    comment: "IPP Get-Printer-Attributes (request id 42) sent as an HTTP POST. Honeyprint answers with bare IPP bytes and no HTTP status line: version 1.1, the CUPS-Get-Default operation code 0x4001 where a status code belongs, and request id 1 whatever the request carried. Genuine IPP servers (CUPS) answer HTTP/1.1 with the request id echoed; raw print ports stay silent."
  - name: honeyprint-ipp-attributes-without-value-length
    id: 571
    port: 9100
    proto: tcp
    steps:
      - input_type: hex
        input: ""
        output_match_type: string
        output: "attributes-charsetutf-8"
        invert_match: false
    confidence: High
    comment: "Unframed IPP request on the raw print port. Honeyprint returns the same canned 76-byte reply, in which attribute values follow their names without the two-byte value length IPP requires (attributes-charsetutf-8, attributes-natural-languageen-us), ended by six end-of-attributes tags. CUPS resets the connection and p910nd stays silent."

          Host: localhost
          Content-Type: application/x-www-form-urlencoded
          Content-Length: 47

          log=admin&pwd=password2&wp-submit=Log+In

        output_match_type: string
        output: <div id="login_error">
        invert_match: false
      - input_type: string

  # honeyhttpd (ids 390-398)
  - name: honeyhttpd-head-501-duplicate-content-length
    id: 390
    port: 80
    proto: tcp
    steps:
      - input_type: string
        input: "HEAD / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.0 501 [^\r\n]*\r\nServer: [^\r\n]*\r\nDate: [^\r\n]*\r\nContent-Length: \d+\r\n(?:[^\r\n]+\r\n)*?Content-Length: \d+\r\n'
        invert_match: false
    confidence: High
    comment: "HEAD is not implemented by the framework (only do_GET and do_POST exist), so HEAD / returns '501 Not Implemented' with an HTTP/1.0 status line, the Server header before Date and two Content-Length headers (one from the error handler, one from the header builder). Apache, nginx and Tomcat answer HEAD with the GET headers over HTTP/1.1 and never send Content-Length twice. Independent of the server module."
  - name: honeyhttpd-http2-request-error-without-status-line
    id: 391
    port: 80
    proto: tcp
    steps:
      - input_type: string
        input: "GET / HTTP/2.0\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^(?:<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2\.0//EN">\s*<html><head>\s*<title>505 HTTP Version Not Supported</title>|<html><head><title>[^<]* - Error report</title>.*<h1>HTTP Status 505 - </h1>)'
        invert_match: false
    confidence: High
    comment: "A request line with HTTP/2.0 is rejected by Python's request parser before the version is known, so the module's 505 error page (Apache or Tomcat style) is sent as bare HTML with no status line or headers. Apache serves such a request normally over HTTP/1.1; nginx and Tomcat send a proper 'HTTP/1.1 505' response."
  - name: honeyhttpd-apache-module-http10-server-before-date
    id: 392
    port: 80
    proto: tcp
    steps:
      - input_type: string
        input: "GET / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '^HTTP/1\.0 \d{3} [^\r\n]*\r\nServer: Apache/[^\r\n]*\r\nDate: '
        invert_match: false
    confidence: High
    comment: "Responses claiming to be Apache (Server: Apache/2.4.9 (Ubuntu) in the shipped modules) come back with an HTTP/1.0 status line to an HTTP/1.1 request and with Server before Date, the order of Python's http.server. Apache httpd answers HTTP/1.1 requests with HTTP/1.1 and always sends Date first."
  - name: honeyhttpd-tomcat7-module-coyote-trailing-space
    id: 393
    port: 8080
    proto: tcp
    steps:
      - input_type: string
        input: "GET / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '^HTTP/1\.0 \d{3} [^\r\n]*\r\nServer: Apache-Coyote/1\.1 \r\nDate: '
        invert_match: false
    confidence: High
    comment: "The Tomcat7Server module sends 'Server: Apache-Coyote/1.1 ' with a trailing space (Python appends a space and the empty system string) after an HTTP/1.0 status line. Tomcat 7's Coyote connector answers HTTP/1.1 with HTTP/1.1 and sends 'Server: Apache-Coyote/1.1' without the space; Tomcat 8.5 and later send no Server header by default."
  - name: honeyhttpd-tomcat7-module-reflects-request-headers
    id: 394

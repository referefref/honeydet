  # WOWHoneypot blocks a scanner after four bad connections, so its signatures run before other web-port signatures
  # wowhoneypot (ids 460-469)
  - name: wowhoneypot-default-page-direct
    id: 460
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /hd-probe-7d1e/nothing-here HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.1 200 OK\r\nDate: [^\r\n]+ GMT\r\nServer: [^\r\n]+\r\nContent-Type: text/html\r\nContent-Length: (?:84|91|266)\r\n\r\n<html>\n<head>\n  <title>(?:hello|sample|login)</title>'
        invert_match: false
    confidence: High
    comment: "WOWHoneypot answers any unknown path with 200 OK and one of its three default pages (hello, sample page or a login form), chosen at random, with exactly four headers in Python http.server order (Date, Server, Content-Type: text/html, Content-Length) and no Connection, ETag or Last-Modified. Genuine nginx and Apache return 404 for a path that does not exist. Requires the honeypot to answer directly (a reverse proxy rewrites the headers)."
  - name: wowhoneypot-default-page-any-front
    id: 461
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /hd-probe-7d1e/nothing-at-all HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.[01] 200 OK\r\n.*\r\n\r\n<html>\n<head>\n  <title>(?:hello</title>\n</head>\n<body>\n  <h1>hello</h1>|sample</title>\n</head>\n<body>\n  <h1>sample page</h1>|login</title>\n</head>\n<body>\n<form action="/login" method="post">)'
        invert_match: false
    confidence: High
    comment: "Same catch-all, matched on the body only so that it also detects WOWHoneypot behind a reverse proxy (as the catch-all of Bwpot): a made-up path returns 200 OK with one of WOWHoneypot's three default pages. A genuine server returns 404."
  - name: wowhoneypot-propfind-ok
    id: 462
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "PROPFIND / HTTP/1.1\r\nHost: x\r\nDepth: 0\r\nContent-Length: 0\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.[01] 200 OK\r\n.*\r\n\r\nok$'
        invert_match: false
    confidence: High
    comment: "WOWHoneypot's default PROPFIND rule answers 200 OK with the two-byte body 'ok' (and, when it answers directly, Server: Microsoft-IIS/7.0 on a server that otherwise says Apache). A WebDAV server answers PROPFIND with 207 Multi-Status and an XML body; nginx and Apache without WebDAV return 405. Survives a reverse proxy."
  - name: wowhoneypot-head-length-one
    id: 463
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "HEAD / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.1 200 OK\r\nDate: [^\r\n]+\r\nServer: [^\r\n]+\r\nContent-Type: text/html\r\nContent-Length: 1$'
        invert_match: false
    confidence: High
    comment: "WOWHoneypot's HEAD rule answers HEAD / with Content-Length: 1 (and then sends a one-space body, which HTTP forbids for HEAD; honeydet trims it), while GET / returns a default page of 84, 91 or 266 bytes. A genuine server sends the headers of the GET response, including its real length, and no body. Requires the honeypot to answer directly (the exact four-header layout)."
  - name: wowhoneypot-options-allow-any-front
    id: 464
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "OPTIONS / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.[01] 200 OK\r\n(?:.*\r\n)?Allow: GET,HEAD,POST,PUT,OPTIONS,CONNECT,PROPFIND(?:\r\n|$)'
        invert_match: false
    confidence: High
    comment: "WOWHoneypot's OPTIONS rule advertises Allow: GET,HEAD,POST,PUT,OPTIONS,CONNECT,PROPFIND (no spaces, CONNECT and PROPFIND on a plain web server), whatever the front end. nginx returns 405 and Apache lists its real methods (GET,POST,OPTIONS,HEAD). Survives a reverse proxy."
  - name: wowhoneypot-http11-without-host
    id: 465
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /hd-probe-7d1e/nohost HTTP/1.1\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.1 200 OK\r\nDate: [^\r\n]+\r\nServer: [^\r\n]+\r\nContent-Type: text/html\r\nContent-Length: (?:84|91|266)\r\n\r\n<html>'
        invert_match: false
    confidence: High
    comment: "An HTTP/1.1 request without a Host header is answered 200 OK with a default page. HTTP/1.1 requires Host, and nginx, Apache, IIS and Tomcat return 400 Bad Request. Requires the honeypot to answer directly (a proxy in front rejects the request)."
  - name: wowhoneypot-phpmyadmin-fixed-cookie
    id: 466
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /phpMyAdmin/ HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.1 200 OK\r\nDate: [^\r\n]+\r\nSet-Cookie: phpMyAdmin=1vbs1ar15h9a880ekmr49f4p4pvbuh89; path=/phpmyadmin/; HttpOnly\r\n.*\r\n\r\nphpmyadmin$'
        invert_match: false
    confidence: Medium
    comment: "WOWHoneypot's phpMyAdmin rule answers /phpMyAdmin/ with the same session cookie value for every visitor (phpMyAdmin=1vbs1ar15h9a880ekmr49f4p4pvbuh89, for a lower-case path) and the ten-byte body 'phpmyadmin' instead of a login page. A genuine phpMyAdmin issues a fresh random session cookie and its login form. Medium: editable rule. Not seen in Bwpot, which sends this path to a real phpMyAdmin."
  - name: wowhoneypot-jsp-coyote-ok
    id: 467
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /hd-probe-7d1e.jsp HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.1 200 OK\r\nDate: [^\r\n]+\r\nServer: Apache-Coyote/1\.1\r\nContent-Type: text/html\r\nContent-Length: 2\r\n\r\nok$'
        invert_match: false
    confidence: Medium
    comment: "Any path containing .jsp is answered by WOWHoneypot's Tomcat rule: 200 OK, Server: Apache-Coyote/1.1 (on a server that says Apache elsewhere) and the body 'ok', for a JSP that cannot exist. Tomcat returns its 404 page. Medium: the rule is part of the editable art/mrrules.xml. Not seen in Bwpot, which sends .jsp to a real Tomcat."
  - name: wowhoneypot-whoami-rule
    id: 468
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "GET /?hd=whoami HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r"
        output_match_type: regex
        output: '(?s)^HTTP/1\.[01] 200 OK\r\n.*\r\n\r\nroot$'
        invert_match: false
    confidence: Medium
    comment: "WOWHoneypot's command-injection rules answer any URL containing =whoami (and any header or body containing whoami) with the four-byte body 'root'. A genuine site serves its normal page for an unknown query parameter. Medium: the rule is part of the editable art/mrrules.xml. Survives a reverse proxy."
  - name: wowhoneypot-put-file-created-any-front
    id: 469
    port: web-ports
    proto: tcp
    steps:
      - input_type: string
        input: "PUT /hd-probe-7d1e.txt HTTP/1.1\r\nHost: x\r\nContent-Length: 4\r\nConnection: close\r\n\r\nhd\r"
        output_match_type: regex
